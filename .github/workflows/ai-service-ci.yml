name: AI Service CI

on:
  push:
    branches: [main]
    paths:
      - "ai-service/**"
      # Test hợp đồng đối chiếu trực tiếp với DTO của backend và kiểu của frontend
      - "backend/src/main/java/com/ecotrace/ai/**"
      - "backend/src/main/java/com/ecotrace/document/domain/Document.java"
      - "frontend/src/api/ai.ts"
      - ".github/workflows/ai-service-ci.yml"
  pull_request:
    paths:
      - "ai-service/**"
      - "backend/src/main/java/com/ecotrace/ai/**"
      - "backend/src/main/java/com/ecotrace/document/domain/Document.java"
      - "frontend/src/api/ai.ts"
      - ".github/workflows/ai-service-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      # Không gọi Gemini: toàn bộ test chạy ở chế độ mock. Gồm test hợp đồng với backend/frontend (tests/test_contract.py).
      - run: python -m pytest tests -q
