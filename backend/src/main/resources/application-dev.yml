# Cấu hình môi trường phát triển (docker-compose: PostgreSQL + MinIO trên localhost)
logging:
  level:
    com.ecotrace: DEBUG
    org.hibernate.SQL: INFO

spring:
  jpa:
    show-sql: false

  # Đọc DB_URL, DB_USER, DB_PASSWORD... từ backend/.env (không commit) khi chạy cục bộ
  config:
    import: optional:file:.env[.properties]

app:
  storage:
    # Dev không bắt buộc MinIO: lưu chứng từ vào backend/storage
    local-dir: ${STORAGE_LOCAL_DIR:./storage}
