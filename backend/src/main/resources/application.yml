spring:
  application:
    name: ecotrace-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecotrace}
    username: ${DB_USER:ecotrace}
    password: ${DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # Schema do Flyway quản lý hoàn toàn
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB         # Chứng từ ≤ 20MB (mục 7.2)
      max-request-size: 100MB
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:change-me-at-least-32-characters-long!!}
    access-token-ttl: PT30M       # 30 phút (mục 22)
    refresh-token-ttl: P14D       # 14 ngày
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:ecotrace-documents}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:change-me}
    path-style-access: true
    presigned-url-ttl: PT5M       # URL ký tạm thời 5 phút (mục 12)
    local-dir: ${STORAGE_LOCAL_DIR:}  # Đặt giá trị để lưu file trên đĩa thay vì S3/MinIO
  passport:
    signing-key-path: ${PASSPORT_SIGNING_KEY_PATH:}
    public-verify-base-url: ${PUBLIC_VERIFY_BASE_URL:http://localhost:5173/verify}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8001}
    timeout: PT60S
    enabled: true
  calculation:
    version: "0.1.0"
  optimizer:                      # Ngưỡng bộ quy tắc đề xuất (mục 9.2), chỉnh không cần sửa code
    solar-min-electricity-share: 0.40
    solar-daytime-coverage: 0.30
    supplier-min-scope3-share: 0.30
    transport-min-road-km: 200
    transport-shift-share: 0.50
    efficiency-min-intensity-increase: 0.10
    efficiency-saving-share: 0.10
    data-min-actual-share: 0.50

